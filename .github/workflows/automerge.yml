name: Auto-merge Denzelly PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'Denzelly'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.KING_MERGE_TOKEN }}
        run: gh pr merge --merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
